<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE ihp SYSTEM "https://resources.jetbrains.com/writerside/1.0/ihp.dtd">

<!--
    Japanese documentation module.

    Writerside has no built-in localisation, and topic file names must be
    unique within a module. Keeping the Japanese manual in its own module lets
    every topic keep the file name its English counterpart uses, so the two
    sites are page-for-page identical and the language switcher can map any
    URL to its translation by inserting or removing the /jp/ segment.

    images/ is populated from ../Writerside/images at build time rather than
    duplicated in Git; see .github/workflows/DocsBuild.yml.
-->

<ihp version="2.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
     xsi:noNamespaceSchemaLocation="https://resources.jetbrains.com/writerside/1.0/writerside-cfg.xsd">
    <topics dir="topics"/>
    <images dir="images" web-path="images"/>
    <categories src="c.list"/>
    <vars src="v.list"/>
    <instance src="jp.tree"/>
</ihp>
