name: Build documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  pages: write

env:
  DOCKER_VERSION: 'latest'

# The English manual (Writerside/hi) publishes at the site root and the
# Japanese manual (WritersideJP/jp) publishes under /jp, so existing English
# URLs are unchanged and every page has a counterpart at the same path with a
# /jp/ segment inserted. Writerside has no localisation support and requires
# unique topic file names per module, which is why Japanese is its own module.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - locale: en
            instance: Writerside/hi
            artifact: webHelpHI2-all.zip
          - locale: ja
            instance: WritersideJP/jp
            artifact: webHelpJP2-all.zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Images and the theme live once, in the English module, and are copied
      # into the Japanese module at build time so the two cannot drift.
      - name: Sync shared assets into the Japanese module
        if: matrix.locale == 'ja'
        run: |
          mkdir -p WritersideJP/images WritersideJP/cfg
          cp -R Writerside/images/. WritersideJP/images/
          cp Writerside/cfg/vite-theme.html WritersideJP/cfg/vite-theme.html

      - name: Build docs using Writerside Docker builder
        uses: JetBrains/writerside-github-action@v4
        with:
          instance: ${{ matrix.instance }}
          docker-version: ${{ env.DOCKER_VERSION }}
          artifact: ${{ matrix.artifact }}

      - name: Save artifact with build results
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ matrix.locale }}
          path: artifacts/${{ matrix.artifact }}
          retention-days: 7

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: docs-*
          merge-multiple: true
          path: artifacts

      - name: Unzip both locales
        run: |
          unzip -O UTF-8 -qq artifacts/webHelpHI2-all.zip -d dir
          unzip -O UTF-8 -qq artifacts/webHelpJP2-all.zip -d dir/jp

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Package and upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dir

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
